services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synaxis
      POSTGRES_PASSWORD: synaxis
      POSTGRES_DB: synaxis
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synaxis -d synaxis"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: ["migrate", "up", "DATABASE_URL"]
    environment:
      DATABASE_URL: postgres://synaxis:synaxis@db:5432/synaxis?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    command: ["server", "DATABASE_URL"]
    environment:
      DATABASE_URL: postgres://synaxis:synaxis@db:5432/synaxis?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  
  ml:
    build: ./backend/ml
    environment:
      DATABASE_URL: postgres://synaxis:synaxis@db:5432/synaxis?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["ml"]
    restart: "no"