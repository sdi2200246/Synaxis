services:
  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks:
      - synaxis-network
    depends_on:
      - backend
      - frontend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synaxis
      POSTGRES_PASSWORD: synaxis
      POSTGRES_DB: synaxis
    ports:
      - "5432:5432"
    networks:
      - synaxis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synaxis -d synaxis"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: ["migrate", "up", "DATABASE_URL"]
    environment:
      DATABASE_URL: postgres://synaxis:synaxis@db:5432/synaxis?sslmode=disable
    networks:
      - synaxis-network
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    command: ["server", "DATABASE_URL"]
    environment:
      DATABASE_URL: postgres://synaxis:synaxis@db:5432/synaxis?sslmode=disable
    networks:
      - synaxis-network
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    networks:
      - synaxis-network
    expose:
      - "5173"

networks:
  synaxis-network:
    driver: bridge

volumes:
  caddy_data: